<html lang="{{ str_replace('_', '-', app()->getLocale()) }}">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Uptime Tracker</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>
    <body class="bg-dark text-light d-flex p-4 p-lg-5 justify-content-lg-center min-vh-100 flex-column">
        <div id="main" class="container w-100" style="max-width: 1000px;">

            <div class="app-header">
                <p class="app-title">
                    <span id="pulse-dot" class="pulse-dot is-idle"></span>
                    Uptime
                </p>
                <div class="header-stats">
                    <div class="stat">
                        <span id="stat-up" class="stat-value up">0</span>
                        <span class="stat-label">up</span>
                    </div>
                    <div class="stat">
                        <span id="stat-down" class="stat-value down">0</span>
                        <span class="stat-label">down</span>
                    </div>
                    <div class="stat">
                        <span id="stat-total" class="stat-value">0</span>
                        <span class="stat-label">watched</span>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-5 d-flex flex-column gap-4">
                    <div id="adder" class="panel">
                        <h2 class="panel-title">Add a url</h2>
                        <div class="d-flex gap-2">
                            <input type="text" id="new-url-input" class="form-control" placeholder="https://example.com">
                            <button id="add-url-btn" class="btn btn-secondary px-4">+</button>
                        </div>
                    </div>
                    <div id="status" class="panel flex-grow-1">
                        <h2 class="panel-title">Activity</h2>
                        <div id="log-container" class="flex-grow-1 overflow-auto"></div>
                    </div>
                </div>
                <div class="col-md-7">
                    <div id="control" class="panel h-100">
                        <h2 class="panel-title">Controller</h2>

                        <label for="timer-input">Delay per check (minutes)</label>
                        <div class="d-flex gap-2 mb-3">
                            <input type="number" id="timer-input" class="form-control w-25" value="1">
                            <button id="timer-submit-btn" class="btn btn-secondary px-4">Submit</button>
                            <button id="start-btn" class="btn btn-secondary px-4">Start</button>
                            <button id="stop-btn" class="btn btn-secondary px-4">Stop</button>
                        </div>
                        <div id="timer-error-container"></div>

                        <label>Watched urls</label>
                        <div id="urls">
                            <ul id="url-list" class="list-group list-group-flush overflow-auto" style="max-height: 250px;"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <script src="main.js"></script>
    </body>
</html>
